    <style>
        /* Retirement notice — see the comment in the body. Self-contained so it does not depend on
           whichever stylesheet this page happens to load. */
        .retired-notice {
            max-width: 34rem;
            margin: 0 auto;
            padding: 5rem 1.5rem 6rem;
            text-align: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .retired-notice h1 {
            margin: 0 0 1rem;
            font-size: 1.75rem;
            line-height: 1.25;
            color: #1B365D;
        }
        .retired-notice p {
            margin: 0 0 2rem;
            font-size: 1.0625rem;
            line-height: 1.6;
            color: #374151;
        }
        .retired-cta {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: #1B365D;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
        .retired-cta:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <nav class="site-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="imb-innovation-logo-navy.png" alt="IMB Innovation" class="logo-img">
            </a>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links">
                <a href="faithbot.html" class="nav-link">FaithBot</a>

                <a href="https://biblepics.donbarger.com" class="nav-link" target="_blank" rel="noopener noreferrer">Bible Pics</a>
                <a href="blog.html" class="nav-link">Blog</a>
            </div>
        </div>
    </nav>
        <div class="tool-container">
            <!-- SMART Goals was an iframe onto https://goals1.donbarger.com. That host has been decommissioned: no DNS
                 record, no Caddy vhost on the shared droplet, no systemd unit, no DigitalOcean app.
                 The page rendered an empty grey frame with no error of any kind.

                 Kept as a page rather than deleted or silently redirected. Nothing links here any
                 more, so the only arrivals are old links and printed QR codes — those people asked
                 for SMART Goals specifically and deserve to be told it is gone, not bounced to the home
                 page without explanation. -->
            <div class="retired-notice">
                <h1>SMART Goals has been retired</h1>
                <p>This tool is no longer available. The rest of the AI tools for missions and
                   ministry are still here.</p>
                <a class="retired-cta" href="index.html">See the current tools &rarr;</a>
            </div>
        </div>
    <script>
        // Mobile menu toggle
        const navToggle = document.querySelector('.nav-toggle');
        const navLinks = document.querySelector('.nav-links');
        
        navToggle.addEventListener('click', () => {
            navToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });
        
        // Close menu when clicking a link
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                navToggle.classList.remove('active');
                navLinks.classList.remove('active');
            });
        });
    </script>
</body>
