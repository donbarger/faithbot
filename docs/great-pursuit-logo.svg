<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1B365D"/>
  <!-- Compass circle -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="1.4" opacity="0.5"/>
  <!-- North arrow (pointing up-right, suggesting pursuit/movement) -->
  <polygon points="16,6 19.5,18 16,15.5 12.5,18" fill="white" opacity="0.95"/>
  <!-- South arrow (smaller, darker) -->
  <polygon points="16,26 12.5,14.5 16,17 19.5,14.5" fill="white" opacity="0.35"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#1B365D"/>
  <circle cx="16" cy="16" r="1" fill="white" opacity="0.7"/>
</svg>
