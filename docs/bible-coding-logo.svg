<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Book cover -->
  <rect x="8" y="6" width="42" height="52" rx="3" ry="3" fill="#8B4513"/>
  <!-- Spine -->
  <rect x="8" y="6" width="8" height="52" rx="2" ry="2" fill="#6B3410"/>
  <!-- Pages (right edge) -->
