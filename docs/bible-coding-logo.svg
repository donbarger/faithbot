<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#5B3A8E"/>
  <!-- signing hand: fingers together, thumb joined to the palm, palm to the viewer -->
  <g fill="#fff">
    <rect x="22.8" y="21" width="4.8" height="16" rx="2.4" transform="rotate(-34 25.2 37)"/>
    <rect x="25" y="12.5" width="4.6" height="18" rx="2.3"/>
    <rect x="29.4" y="9.5" width="4.6" height="21" rx="2.3"/>
    <rect x="33.8" y="11" width="4.6" height="19.5" rx="2.3"/>
    <rect x="38.2" y="14.5" width="4.3" height="16" rx="2.15"/>
    <path d="M25 26h17.5v10a7.5 7.5 0 0 1-7.5 7.5h-2.5a7.5 7.5 0 0 1-7.5-7.5z"/>
  </g>
  <!-- finger divisions -->
  <path d="M29.5 16v12M33.9 13v15M38.3 15.5v12.5" stroke="#5B3A8E" stroke-width=".9" stroke-linecap="round"/>
  <!-- movement arrow (how sign-language resources mark motion) -->
  <path d="M47 27Q52 18.5 46 11" fill="none" stroke="#F2B134" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M46 15.2L46 11L49.9 12.4" fill="none" stroke="#F2B134" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- open Bible -->
  <path d="M9 43.5l22 3v11l-22-3z" fill="#fff"/>
  <path d="M55 43.5l-22 3v11l22-3z" fill="#fff"/>
  <!-- color-coded lines: people, places, actions -->
  <g stroke-width="2.2" stroke-linecap="round">
    <path d="M13 47.6l7 1" stroke="#E8505B"/>
    <path d="M22 48.9l5.5 .8" stroke="#2E9BD6"/>
    <path d="M13 51.6l12 1.6" stroke="#F2B134"/>
    <path d="M37 49.7l5.5-.8" stroke="#3DAA6D"/>
    <path d="M44.5 48.6l6.5-.9" stroke="#E8505B"/>
    <path d="M37 53.7l14-1.9" stroke="#2E9BD6"/>
  </g>
</svg>
